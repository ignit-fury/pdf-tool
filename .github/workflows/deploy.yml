
name: PDF Tool - CI/CD Deployment

on:
  push:
    branches:
      - feat/document-viewer-editor

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-tool-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Oracle Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh "$SERVER_USER@$SERVER_HOST" \
            'cd /home/ubuntu/pdf-tool && bash deploy/setup.sh'

      - name: Verify deployment
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh "$SERVER_USER@$SERVER_HOST" \
            'sudo systemctl is-active pdf-tool &&
             curl -fsS http://127.0.0.1:8090/'

      - name: Deployment successful
        run: echo "PDF Tool deployed successfully!"

