
name: PDF Tool - CI/CD Deployment

on:
  push:
    branches:
      - feat/document-viewer-editor

  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pdf-tool-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Oracle Cloud
    runs-on: ubuntu-latest
    environment: pdf

    steps:
      # workflow_run would be cleaner, but GitHub only fires it from workflows on the default branch.
      - name: Wait for Tests to pass on this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for i in $(seq 30); do
            id=$(gh run list --workflow tests.yml --commit "$GITHUB_SHA" --event push --json databaseId -q '.[0].databaseId')
            [ -n "$id" ] && break
            sleep 10
          done
          [ -n "$id" ] || { echo "::error::No Tests run found for $GITHUB_SHA."; exit 1; }
          gh run watch "$id" --interval 60 --exit-status >/dev/null || { echo "::error::Tests did not pass (run $id); not deploying."; exit 1; }

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          for name in SSH_KEY KNOWN_HOSTS SERVER_HOST SERVER_USER; do
            [ -n "${!name}" ] || { echo "::error::Missing repo secret for $name (Settings > Secrets and variables > Actions)."; exit 1; }
          done
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # shortcut: setup.sh deploys the branch tip, not the tested SHA; a push landing between test finish and deploy goes out untested. Pass the SHA to setup.sh if that ever bites.
      - name: Deploy application
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" \
            'cd /home/ubuntu/pdf-tool && PORT=8090 bash deploy/setup.sh'

      - name: Verify deployment
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" \
            'sudo systemctl is-active pdf-tool &&
             curl -fsS http://127.0.0.1:8090/'

      - name: Deployment successful
        run: echo "PDF Tool deployed successfully!"

