name: Tests

# The unit test suite. Added in Phase 2 research after discovering that 37 tests existed and no
# workflow ran any of them — the corpus, harness and license-gate workflows each run their own
# tool directly, so every commit through Phase 1 was CI-unverified at the unit level.
#
# Corpus PDFs are git-lfs tracked and several tests read real fixtures, so LFS content must be
# fetched. Without `lfs: true` the checkout yields LFS pointer files and the PDF-reading tests fail
# on files that look present but are 130-byte text stubs.

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build pinned renderer and browser test environment
        run: docker build -f Dockerfile.ci -t pdf-tool-tests:ci .

      - name: Privacy canary and hostile-input gates (Linux enforcement)
        run: >-
          docker run --rm --tmpfs /tmp:rw,nosuid,nodev,size=256m
          --tmpfs /dev/shm:rw,nosuid,nodev,size=1536m
          pdf-tool-tests:ci uv run --frozen pytest -q
          tests/test_privacy_canary.py tests/test_ephemerality.py
          tests/test_isolation.py tests/test_hostile_input.py tests/test_linux_sandbox.py

      - name: Complete regression suite
        # The mandatory Harness PDF/A job owns these two complete test files:
        # they need its authenticated veraPDF/JRE mounts as well as native tools.
        # Docker tmpfs is noexec by default; the veraPDF gate tests execute stub validators from tmp_path.
        run: >-
          docker run --rm --tmpfs /tmp:rw,exec,nosuid,nodev,size=256m
          --tmpfs /dev/shm:rw,nosuid,nodev,size=1536m
          pdf-tool-tests:ci uv run --frozen pytest -q
          --ignore=tests/test_gate_g7a.py --ignore=tests/test_docx_cuttable.py

      - name: Strict engine and server types
        run: docker run --rm pdf-tool-tests:ci uv run --frozen mypy engine/ server/

      - name: Runtime dependency license gate
        run: docker run --rm pdf-tool-tests:ci uv run --frozen python tools/license_gate.py
