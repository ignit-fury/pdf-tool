name: License Gate

on:
  push:
  pull_request:

jobs:
  agpl-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.10.4"

      - name: Sync resolved dependencies (locked, no upgrades)
        run: uv sync --locked

      - name: Run AGPL/Affero license gate
        run: uv run python tools/license_gate.py
