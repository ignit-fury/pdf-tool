name: License Gate

on:
  push:
  pull_request:

jobs:
  agpl-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.10.4"

      - name: Sync resolved dependencies (locked, no upgrades)
        run: uv sync --locked

      - name: Run AGPL/Affero license gate
        run: uv run python tools/license_gate.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install locked client closure
        working-directory: client
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test client license policy with forbidden negative controls
        run: node --test tools/client_license_gate.test.mjs

      - name: Audit resolved browser dependencies and bundled notices
        run: node tools/client_license_gate.mjs
