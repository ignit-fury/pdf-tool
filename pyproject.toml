[project]
name = "pdf-tool-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fonttools==4.63.0",
    "pikepdf==10.11.0",
    "pillow==12.3.0",
    "playa-pdf==1.1.0",
    "pypdfium2==5.12.1",
    "uharfbuzz==0.56.0",
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "python-multipart==0.0.32",
    "python-docx==1.2.0",
]

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "corpus: exercises the full corpus/public tier (slower, excluded from the quick per-commit run)",
]

[tool.mypy]
strict = true
files = ["engine"]

# fontTools ships no py.typed marker, so strict mode cannot see its types. Scoped to
# fontTools alone -- never a blanket ignore_missing_imports, which would silently hide a
# genuinely missing import anywhere in the engine.
[[tool.mypy.overrides]]
module = ["fontTools.*"]
ignore_missing_imports = true
